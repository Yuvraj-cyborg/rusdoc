[package]
name = "rusdoc"
version = "0.1.0"
edition = "2024"
description = "A terminal-first Rust documentation query engine"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
fuzzy-matcher = "0.3"
owo-colors = "4.2"
pulldown-cmark = "0.13"
rustdoc-types = "0.56.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
terminal_size = "0.4"
textwrap = "0.16"
thiserror = "2"
ureq = "3"
zstd = "0.13"
